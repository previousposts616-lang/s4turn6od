<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Pro  Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Padauk:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:       #050a12;
            --bg2:      #080f1c;
            --bg3:      #0c1628;
            --panel:    rgba(8,15,28,0.95);
            --border:   rgba(0,210,255,0.18);
            --border2:  rgba(0,210,255,0.35);
            --cyan:     #00d2ff;
            --cyan2:    #00f0ff;
            --gold:     #f5c842;
            --danger:   #ff2d55;
            --success:  #00e676;
            --muted:    rgba(180,210,255,0.45);
            --text:     #cce8ff;
            --mono:     'Share Tech Mono', monospace;
            --sans:     'Rajdhani', 'Padauk', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        /*  BG GRID  */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(0,210,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,210,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed; inset: 0;
            background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,130,200,0.12), transparent 70%);
            pointer-events: none; z-index: 0;
        }

        /*  HEADER  */
        .header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(5,10,18,0.96);
            border-bottom: 1px solid var(--border2);
            padding: 0 20px;
            height: 58px;
            display: flex; align-items: center; justify-content: space-between;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 40px rgba(0,200,255,0.07);
        }

        .logo {
            font-family: var(--mono);
            font-size: 17px;
            letter-spacing: 4px;
            color: var(--cyan);
            text-shadow: 0 0 18px rgba(0,210,255,0.6), 0 0 40px rgba(0,210,255,0.2);
            position: relative;
        }
        .logo span { color: var(--gold); text-shadow: 0 0 14px rgba(245,200,66,0.5); }

        .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }

        .status-pill {
            display: flex; align-items: center; gap: 5px;
            background: rgba(0,210,255,0.07);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3px 10px;
        }
        .status-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--muted);
            transition: background .4s;
        }
        .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 2s infinite; }
        .status-dot.offline { background: var(--danger); }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.5;} }

        #statusText { font-family: var(--mono); font-size: 10px; color: var(--muted); }

        input[type="date"] {
            background: none; border: none;
            color: var(--cyan); font-family: var(--mono); font-size: 11px;
            outline: none; cursor: pointer;
        }

        /*  TOAST  */
        #toast {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
            background: var(--bg3);
            border: 1px solid var(--border2);
            border-radius: 8px;
            padding: 10px 22px;
            font-family: var(--mono); font-size: 12px;
            color: var(--cyan2);
            z-index: 9999;
            opacity: 0; pointer-events: none;
            transition: opacity .3s;
            white-space: nowrap;
            box-shadow: 0 4px 30px rgba(0,210,255,0.15);
        }
        #toast.show { opacity: 1; }

        /*  DASHBOARD GRID  */
        .dashboard {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 14px;
            position: relative; z-index: 1;
        }

        .card {
            position: relative;
            background: linear-gradient(135deg, rgba(12,22,40,0.95), rgba(8,15,28,0.98));
            border: 1px solid var(--border);
            border-top: 2px solid var(--cyan);
            border-radius: 10px;
            padding: 18px 14px 14px;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s, border-color .2s;
            overflow: hidden;
            animation: fadeUp .4s ease both;
        }
        .card:nth-child(1){animation-delay:.05s}
        .card:nth-child(2){animation-delay:.10s}
        .card:nth-child(3){animation-delay:.15s}
        .card:nth-child(4){animation-delay:.20s}
        .card:nth-child(5){animation-delay:.25s}
        .card:nth-child(6){animation-delay:.30s}

        @keyframes fadeUp {
            from { opacity:0; transform:translateY(14px); }
            to   { opacity:1; transform:translateY(0); }
        }

        .card::before {
            content:'';
            position:absolute; top:0; left:0; right:0; height:1px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
            opacity: 0; transition: opacity .3s;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(0,210,255,0.14); border-color: var(--border2); }
        .card:hover::before { opacity: 1; }

        .card-glow {
            position:absolute; top:-40px; right:-40px;
            width:90px; height:90px;
            background: radial-gradient(circle, rgba(0,210,255,0.1), transparent 70%);
            border-radius: 50%;
        }

        .badge {
            position: absolute; top: -7px; right: -7px;
            background: linear-gradient(135deg, var(--cyan), #0066ff);
            color: #fff;
            font-family: var(--mono); font-size: 10px;
            padding: 3px 8px; border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,210,255,0.4);
        }

        .card-name {
            font-size: 14px; font-weight: 700; letter-spacing: 1px;
            color: var(--text); margin-bottom: 8px;
            font-family: var(--sans);
        }
        .card-pay {
            font-family: var(--mono); font-size: 16px;
            color: var(--cyan); font-weight: bold;
            text-shadow: 0 0 12px rgba(0,210,255,0.4);
        }
        .card-label { font-size: 9px; color: var(--muted); letter-spacing: 2px; margin-top: 3px; }

        /*  NAV  */
        .nav {
            position: fixed; bottom: 14px; left: 14px; right: 14px;
            background: rgba(5,10,18,0.97);
            border: 1px solid var(--border2);
            border-radius: 14px;
            display: flex; justify-content: space-around;
            padding: 10px 8px;
            z-index: 1000;
            backdrop-filter: blur(20px);
            box-shadow: 0 -4px 40px rgba(0,210,255,0.08), 0 8px 40px rgba(0,0,0,0.5);
        }

        .nav-item {
            background: none; border: none;
            color: var(--muted);
            font-family: var(--mono); font-size: 10px;
            cursor: pointer; font-weight: bold;
            letter-spacing: 1px;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all .2s;
            position: relative;
        }
        .nav-item:hover, .nav-item.active {
            color: var(--cyan);
            background: rgba(0,210,255,0.08);
        }
        .nav-item::after {
            content: '';
            position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
            width: 0; height: 2px;
            background: var(--cyan);
            border-radius: 2px;
            transition: width .2s;
        }
        .nav-item:hover::after { width: 60%; }

        #setBtn { display: none; }
        .is-admin #setBtn { display: block; }

        /*  MODAL  */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            align-items: flex-end;
            backdrop-filter: blur(4px);
        }
        .modal.open { display: flex; }

        .modal-content {
            background: linear-gradient(160deg, #0a1628, #060d1a);
            width: 100%; max-width: 520px;
            border-top: 2px solid var(--cyan);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            padding: 22px 20px 24px;
            max-height: 88vh; overflow-y: auto;
            margin: 0 auto;
            border-radius: 20px 20px 0 0;
            animation: slideUp .3s cubic-bezier(.32,.72,0,1);
            position: relative;
        }
        .modal-content::before {
            content: '';
            position: absolute; top: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,210,255,0.6), transparent);
        }
        @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 18px; padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }
        .modal-title {
            font-family: var(--mono); font-size: 13px;
            color: var(--cyan); letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(0,210,255,0.4);
        }
        .close-btn {
            background: rgba(0,210,255,0.08);
            border: 1px solid var(--border2);
            color: var(--cyan);
            width: 28px; height: 28px; border-radius: 50%;
            cursor: pointer; font-size: 12px;
            display: flex; align-items: center; justify-content: center;
            transition: all .2s;
        }
        .close-btn:hover { background: rgba(255,45,85,0.15); border-color: var(--danger); color: var(--danger); }

        /*  FORM  */
        .input {
            width: 100%; padding: 12px 14px;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(0,210,255,0.15);
            border-radius: 8px;
            color: var(--text); font-family: 'Padauk', sans-serif; font-size: 14px;
            margin-bottom: 10px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .input:focus { border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(0,210,255,0.12); }
        .input::placeholder { color: var(--muted); }

        .btn {
            padding: 12px 20px;
            border: none; border-radius: 8px;
            font-family: var(--mono); font-weight: bold;
            cursor: pointer; width: 100%; margin-bottom: 8px;
            font-size: 12px; letter-spacing: 1px;
            transition: all .2s; position: relative; overflow: hidden;
        }
        .btn::after {
            content:''; position:absolute; inset:0;
            background: rgba(255,255,255,0.05);
            opacity:0; transition:opacity .2s;
        }
        .btn:hover::after { opacity:1; }

        .btn-primary {
            background: transparent;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            box-shadow: 0 0 18px rgba(0,210,255,0.1), inset 0 0 14px rgba(0,210,255,0.05);
        }
        .btn-primary:hover { box-shadow: 0 0 24px rgba(0,210,255,0.25), inset 0 0 20px rgba(0,210,255,0.08); }
        .btn-danger { background: var(--danger); color: #fff; box-shadow: 0 4px 20px rgba(255,45,85,0.3); }
        .btn-danger:hover { box-shadow: 0 4px 30px rgba(255,45,85,0.5); }
        .btn-gold { background: transparent; border: 1px solid var(--gold); color: var(--gold); }

        /*  QUICK SHORTCUTS  */
        .quick-section {
            margin-bottom: 14px;
            background: rgba(0,210,255,0.04);
            border: 1px solid var(--border);
            border-radius: 10px; padding: 12px;
        }
        .quick-label { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 2px; margin-bottom: 8px; }
        .quick-pay-wrap { display: flex; gap: 6px; flex-wrap: wrap; }
        .q-btn {
            flex: 1; min-width: 70px;
            padding: 9px 6px;
            background: rgba(0,210,255,0.07);
            border: 1px solid rgba(0,210,255,0.2);
            color: var(--cyan);
            border-radius: 7px;
            font-size: 10px; font-family: 'Padauk', sans-serif;
            cursor: pointer;
            transition: all .2s;
        }
        .q-btn:hover { background: rgba(0,210,255,0.15); border-color: var(--cyan); }

        /*  LIST ROWS  */
        .list-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 11px 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 6px;
            border-radius: 8px; cursor: pointer;
            transition: background .2s, border-color .2s;
        }
        .list-row:hover { background: rgba(0,210,255,0.06); border-color: var(--border); }

        /*  STAT BOX  */
        .stat-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .stat-item {
            padding: 14px 10px; border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(0,210,255,0.04);
            text-align: center;
        }
        .stat-label { font-family: var(--mono); font-size: 8px; color: var(--muted); letter-spacing: 2px; margin-bottom: 6px; }
        .stat-value { font-family: var(--mono); font-size: 18px; font-weight: bold; }

        /*  TABLE  */
        table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 8px; }
        th { padding: 8px 6px; color: var(--muted); font-family: var(--mono); font-size: 9px; letter-spacing: 1.5px; border-bottom: 1px solid var(--border); text-align: left; }
        td { padding: 9px 6px; border-bottom: 1px solid rgba(255,255,255,0.04); font-family: 'Padauk', sans-serif; vertical-align: middle; }
        tr:hover td { background: rgba(0,210,255,0.04); }

        .edit-link {
            color: var(--cyan); font-family: var(--mono); font-size: 9px;
            cursor: pointer; opacity: 0.6; letter-spacing: 1px;
            padding: 3px 7px; border-radius: 4px;
            border: 1px solid transparent;
            transition: all .2s;
        }
        .edit-link:hover { opacity:1; border-color: var(--border2); background: rgba(0,210,255,0.08); }

        /*  BATCH BAR  */
        .batch-bar {
            display: none;
            background: rgba(255,45,85,0.08);
            border: 1px solid rgba(255,45,85,0.3);
            border-radius: 8px;
            padding: 10px 14px;
            justify-content: space-between; align-items: center;
            margin-bottom: 10px;
            position: sticky; top: 0; z-index: 10;
        }

        /*  SECTION DIVIDER  */
        .section-title {
            font-family: var(--mono); font-size: 9px; letter-spacing: 3px;
            color: var(--muted); margin-bottom: 10px; padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 8px;
        }
        .section-title::before { content:'//'; color: var(--cyan); opacity:.5; }

        /*  LOADING  */
        .loader {
            display: flex; justify-content: center; padding: 30px;
        }
        .loader-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--cyan); margin: 0 4px;
            animation: bounce .8s infinite alternate;
        }
        .loader-dot:nth-child(2){animation-delay:.2s}
        .loader-dot:nth-child(3){animation-delay:.4s}
        @keyframes bounce { to { transform: translateY(-10px); opacity:.4; } }

        /*  SCROLLBAR  */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,210,255,0.2); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,210,255,0.4); }

        /*  MONTH LOG ENTRY  */
        .day-block {
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .day-block-header {
            background: rgba(0,210,255,0.06);
            padding: 8px 14px;
            font-family: var(--mono); font-size: 10px;
            color: var(--cyan); letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between;
        }
        .day-block table { margin: 0; }
        .day-block td, .day-block th { padding: 8px 10px; }

        /* Checkbox style */
        input[type="checkbox"] {
            accent-color: var(--cyan);
            width: 14px; height: 14px; cursor: pointer;
        }

        .empty-state {
            text-align: center; padding: 30px;
            color: var(--muted); font-family: var(--mono); font-size: 11px;
        }
        .empty-state div { font-size: 24px; margin-bottom: 8px; opacity: .4; }
    </style>
</head>
<body id="mainBody">

<!-- TOAST -->
<div id="toast"></div>

<!-- HEADER -->
<div class="header">
    <div class="logo">SVC<span></span>PRO</div>
    <div class="header-right">
        <div class="status-pill">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">CONNECTING</span>
        </div>
        <input type="date" id="viewDate" onchange="changeDate(this.value)">
    </div>
</div>

<!-- GRID -->
<div class="dashboard" id="techGrid">
    <div class="loader">
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
    </div>
</div>

<!-- NAV -->
<div class="nav">
    <button class="nav-item" onclick="showDailySummary()">DAY</button>
    <button class="nav-item" onclick="showMonthlySummary()">MONTH</button>
    <button class="nav-item" id="setBtn" onclick="openSettings()">SETTINGS</button>
    <button class="nav-item" id="loginBtn" onclick="toggleLogin()">LOGIN</button>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="handleModalBackdrop(event)">
    <div class="modal-content" id="modalContent">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">INFO</div>
            <button class="close-btn" onclick="closeModal()"></button>
        </div>
        <div id="modalBody"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// 
//  CONFIG & INIT
// 
const firebaseConfig = {
    apiKey: "AIzaSyBbO9aN3KsRkvxRfLtcjopBiGm2BffbG4w",
    authDomain: "servicespor-b961a.firebaseapp.com",
    databaseURL: "https://servicespor-b961a-default-rtdb.firebaseio.com/",
    projectId: "servicespor-b961a",
    storageBucket: "servicespor-b961a.firebasestorage.app",
    messagingSenderId: "551857614591",
    appId: "1:551857614591:web:b5208ca96e686208aae6ca"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let data = { technicians: [], masterNames: [], adminPass: "1234", shortcuts: [] };
let isAdmin = false;
let selectedDate = new Date().toLocaleDateString('en-CA');
let currentViewingMonth = selectedDate.substring(0, 7);
let dbListener = null;

// Set date input default
document.getElementById('viewDate').value = selectedDate;

// 
//  TOAST
// 
let toastTimeout;
function showToast(msg, color = 'var(--cyan)') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.color = color;
    t.style.borderColor = color === 'var(--cyan)' ? 'var(--border2)' : color;
    t.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => t.classList.remove('show'), 2200);
}

// 
//  HELPERS
// 
const hideValue = (val) => isAdmin
    ? Number(val).toLocaleString()
    : '<span style="color:var(--muted);letter-spacing:3px;"></span>';

function escapeHtml(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(str || ''));
    return d.innerHTML;
}

// 
//  FIREBASE
// 
db.ref(".info/connected").on("value", snap => {
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    const online = snap.val();
    dot.className = 'status-dot ' + (online ? 'online' : 'offline');
    text.textContent = online ? 'ONLINE' : 'OFFLINE';
    text.style.color = online ? 'var(--success)' : 'var(--danger)';
});

dbListener = db.ref('service_pro_v21').on('value', snap => {
    data = snap.val() || { technicians: [], masterNames: [], adminPass: "1234", shortcuts: [] };
    if (!data.technicians) data.technicians = [];
    if (!data.masterNames) data.masterNames = [];
    if (!data.shortcuts) data.shortcuts = [];
    renderGrid();
});

function save() {
    return db.ref('service_pro_v21').set(data).then(() => {
        showToast(' SAVED', 'var(--success)');
    }).catch(err => {
        showToast(' SAVE FAILED', 'var(--danger)');
        console.error(err);
    });
}

// 
//  RENDER GRID
// 
function renderGrid() {
    const grid = document.getElementById('techGrid');
    grid.innerHTML = '';
    if (!data.masterNames?.length) {
        grid.innerHTML = '<div class="empty-state"><div></div>No technicians added.<br>Login  Settings to add.</div>';
        return;
    }
    data.masterNames.forEach((name, i) => {
        const tech = (data.technicians).find(t => t.name === name && t.date === selectedDate);
        let pay = 0, count = 0;
        if (tech?.rows) { tech.rows.forEach(r => pay += Number(r.pay || 0)); count = tech.rows.length; }

        const card = document.createElement('div');
        card.className = 'card';
        card.style.animationDelay = (i * 0.06) + 's';
        card.onclick = () => openTechDetail(name);
        card.innerHTML = `
            <div class="card-glow"></div>
            ${count > 0 ? `<div class="badge">${count}</div>` : ''}
            <div class="card-name">${escapeHtml(name)}</div>
            <div class="card-pay">${pay.toLocaleString()}</div>
            <div class="card-label">KS  TODAY</div>`;
        grid.appendChild(card);
    });
}

// 
//  MODAL
// 
function openModal(title, bodyHtml) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHtml;
    const modal = document.getElementById('modal');
    modal.classList.add('open');
}

function closeModal() {
    document.getElementById('modal').classList.remove('open');
}

function handleModalBackdrop(e) {
    if (e.target === document.getElementById('modal')) closeModal();
}

// 
//  TECH DETAIL (DAY)
// 
function openTechDetail(name) {
    let tech = data.technicians.find(t => t.name === name && t.date === selectedDate);
    if (!tech) {
        tech = { name, date: selectedDate, rows: [] };
        data.technicians.push(tech);
        save();
    }

    const rows = [...(tech.rows || [])].reverse();
    let rowsHtml = rows.length
        ? rows.map((r, i) => {
            const realIdx = (tech.rows.length - 1) - i;
            return `<tr>
                <td style="font-family:Padauk">${escapeHtml(r.task)}</td>
                <td style="color:var(--success);">${hideValue(r.get)}</td>
                <td style="color:var(--cyan);">${Number(r.pay || 0).toLocaleString()}</td>
                <td><span class="edit-link" onclick="editEntry('${escapeHtml(name)}','${selectedDate}',${realIdx})">EDIT</span></td>
            </tr>`;
        }).join('')
        : `<tr><td colspan="4" style="color:var(--muted); font-family:var(--mono); text-align:center; padding:16px;">NO RECORDS</td></tr>`;

    openModal(`${name}  ${selectedDate}`, `
        <table>
            <tr><th>TASK</th><th>GET</th><th>PAY</th><th></th></tr>
            ${rowsHtml}
        </table>
        <button class="btn btn-primary" style="margin-top:18px;" onclick="showEntryForm('${escapeHtml(name)}')">+ ADD RECORD</button>
    `);
}

// 
//  ENTRY FORM
// 
function showEntryForm(name) {
    const shortcuts = data.shortcuts || [];
    const scHtml = shortcuts.length
        ? shortcuts.map(s => `<button class="q-btn" onclick="quickFill('${escapeHtml(s.task)}',${Number(s.pay)})">${escapeHtml(s.task)}<br><span style="opacity:.6;font-size:9px;">${Number(s.pay).toLocaleString()}</span></button>`).join('')
        : '<span style="color:var(--muted);font-size:11px;">No shortcuts. Add in Settings.</span>';

    openModal('NEW RECORD', `
        <div class="quick-section">
            <div class="quick-label">QUICK FILL</div>
            <div class="quick-pay-wrap">${scHtml}</div>
        </div>
        <input id="inTask" class="input" placeholder="Task / Description">
        <input id="inGet" type="number" class="input" placeholder="Get Amount" min="0">
        <input id="inPay" type="number" class="input" placeholder="Pay Amount" min="0">
        <button class="btn btn-primary" onclick="saveEntry('${escapeHtml(name)}')"> SAVE RECORD</button>
        <button class="btn" style="background:none;border:none;color:var(--muted);font-size:11px;" onclick="openTechDetail('${escapeHtml(name)}')"> BACK</button>
    `);
}

function quickFill(t, p) {
    document.getElementById('inTask').value = t;
    document.getElementById('inPay').value = p;
}

function saveEntry(name) {
    const tech = data.technicians.find(t => t.name === name && t.date === selectedDate);
    const task = document.getElementById('inTask').value.trim();
    const get = Number(document.getElementById('inGet').value) || 0;
    const pay = Number(document.getElementById('inPay').value) || 0;

    if (!task) { showToast(' TASK REQUIRED', 'var(--danger)'); return; }
    if (pay < 0 || get < 0) { showToast(' INVALID AMOUNT', 'var(--danger)'); return; }

    if (!tech.rows) tech.rows = [];
    tech.rows.push({ task, get, pay });
    save().then(() => openTechDetail(name));
}

// 
//  EDIT ENTRY
// 
function editEntry(name, date, idx) {
    const tech = data.technicians.find(t => t.name === name && t.date === date);
    if (!tech?.rows?.[idx]) return;
    const row = tech.rows[idx];
    openModal('EDIT RECORD', `
        <input id="editTask" class="input" value="${escapeHtml(row.task)}">
        <input id="editGet" type="number" class="input" value="${row.get || 0}" min="0">
        <input id="editPay" type="number" class="input" value="${row.pay || 0}" min="0">
        <button class="btn btn-primary" onclick="updateEntry('${escapeHtml(name)}','${date}',${idx})"> UPDATE</button>
        <button class="btn btn-danger" onclick="deleteEntry('${escapeHtml(name)}','${date}',${idx})"> DELETE</button>
    `);
}

function updateEntry(name, date, idx) {
    const tech = data.technicians.find(t => t.name === name && t.date === date);
    tech.rows[idx] = {
        task: document.getElementById('editTask').value.trim(),
        get: Number(document.getElementById('editGet').value) || 0,
        pay: Number(document.getElementById('editPay').value) || 0
    };
    save().then(() => {
        const title = document.getElementById('modalTitle').textContent;
        if (title.includes('Detail')) viewTechMonthDetail(name, currentViewingMonth);
        else openTechDetail(name);
    });
}

function deleteEntry(name, date, idx) {
    if (!confirm('Delete this record?')) return;
    const tech = data.technicians.find(t => t.name === name && t.date === date);
    tech.rows.splice(idx, 1);
    save().then(() => openTechDetail(name));
}

// 
//  DAILY SUMMARY
// 
function showDailySummary() {
    let totalPay = 0;
    const rows = (data.technicians || []).filter(t => t.date === selectedDate);

    let html = '';
    if (!rows.length) {
        html = '<div class="empty-state"><div></div>No records for this date.</div>';
    } else {
        html = rows.map(t => {
            let dp = 0; (t.rows || []).forEach(r => dp += Number(r.pay || 0)); totalPay += dp;
            return `<div class="list-row"><div>${escapeHtml(t.name)}</div><span style="color:var(--cyan);font-family:var(--mono);">${dp.toLocaleString()} KS</span></div>`;
        }).join('');
    }

    openModal(`DAY  ${selectedDate}`, `
        <div class="stat-box" style="margin-bottom:16px;">
            <div class="stat-item" style="border-color:var(--cyan); grid-column:1/-1;">
                <div class="stat-label">TOTAL PAY</div>
                <div class="stat-value" style="color:var(--cyan);">${totalPay.toLocaleString()} KS</div>
            </div>
        </div>
        <div class="section-title">TECHNICIANS</div>
        ${html}
    `);
}

// 
//  MONTHLY SUMMARY
// 
function showMonthlySummary() {
    let techTotals = {}, dailyTotals = {}, grandGet = 0, grandPay = 0;

    (data.technicians || []).filter(t => t.date?.startsWith(currentViewingMonth)).forEach(t => {
        if (!techTotals[t.name]) techTotals[t.name] = { get: 0, pay: 0 };
        if (!dailyTotals[t.date]) dailyTotals[t.date] = { get: 0, pay: 0 };
        (t.rows || []).forEach(r => {
            const g = Number(r.get || 0), p = Number(r.pay || 0);
            techTotals[t.name].get += g; techTotals[t.name].pay += p;
            dailyTotals[t.date].get += g; dailyTotals[t.date].pay += p;
            grandGet += g; grandPay += p;
        });
    });

    const techRows = Object.keys(techTotals).map(name => `
        <tr class="list-row" onclick="viewTechMonthDetail('${escapeHtml(name)}','${currentViewingMonth}')" style="display:table-row; cursor:pointer;">
            <td><b style="font-family:var(--sans);">${escapeHtml(name)}</b></td>
            <td style="color:var(--success); font-family:var(--mono);">${hideValue(techTotals[name].get)}</td>
            <td style="text-align:right; color:var(--cyan); font-family:var(--mono);">${techTotals[name].pay.toLocaleString()}</td>
        </tr>`).join('') || `<tr><td colspan="3" style="color:var(--muted); text-align:center; padding:12px;">No data</td></tr>`;

    const dayRows = Object.keys(dailyTotals).sort().reverse().map(date => `
        <div class="list-row" style="cursor:default;">
            <div style="font-family:var(--mono); font-size:11px;">${date}</div>
            <div style="text-align:right; font-family:var(--mono); font-size:11px;">
                <span style="color:var(--success);">${hideValue(dailyTotals[date].get)}</span>
                <span style="color:var(--muted);"> / </span>
                <span style="color:var(--cyan);">${dailyTotals[date].pay.toLocaleString()}</span>
            </div>
        </div>`).join('');

    openModal('MONTHLY OVERVIEW', `
        <input type="month" class="input" value="${currentViewingMonth}" onchange="currentViewingMonth=this.value; showMonthlySummary();">
        <div class="stat-box">
            <div class="stat-item" style="border-color:var(--success);">
                <div class="stat-label">TOTAL GET</div>
                <div class="stat-value" style="color:var(--success);">${hideValue(grandGet)}</div>
            </div>
            <div class="stat-item" style="border-color:var(--cyan);">
                <div class="stat-label">TOTAL PAY</div>
                <div class="stat-value" style="color:var(--cyan);">${grandPay.toLocaleString()}</div>
            </div>
        </div>
        <div class="section-title">BY TECHNICIAN</div>
        <table>
            <tr><th>NAME</th><th>GET</th><th style="text-align:right;">PAY</th></tr>
            ${techRows}
        </table>
        <div class="section-title" style="margin-top:16px;">DAILY LOG</div>
        ${dayRows || '<div class="empty-state">No records this month.</div>'}
    `);
}

// 
//  TECH MONTH DETAIL
// 
function viewTechMonthDetail(name, month) {
    const monthLogs = (data.technicians || [])
        .filter(t => t.name === name && t.date?.startsWith(month))
        .sort((a, b) => b.date.localeCompare(a.date));

    let totalGet = 0, totalPay = 0;
    monthLogs.forEach(t => (t.rows || []).forEach(r => {
        totalGet += Number(r.get || 0); totalPay += Number(r.pay || 0);
    }));

    let batchBar = '';
    if (isAdmin) {
        batchBar = `
            <div style="margin:10px 0; display:flex; align-items:center; gap:10px;">
                <input type="checkbox" id="selectAll" onchange="toggleAll(this)">
                <label for="selectAll" style="font-size:11px; font-family:var(--mono); cursor:pointer;">SELECT ALL</label>
            </div>
            <div id="batchBar" class="batch-bar">
                <span id="selCount" style="font-family:var(--mono); font-size:11px;">0 selected</span>
                <button class="btn btn-danger" style="width:auto;margin:0;padding:6px 14px;font-size:10px;" onclick="deleteSelected('${escapeHtml(name)}','${month}')">DELETE SELECTED</button>
            </div>`;
    }

    const dayBlocks = monthLogs.map(t => {
        const rows = (t.rows || []).map((r, idx) => `
            <tr>
                ${isAdmin ? `<td width="20"><input type="checkbox" class="row-check" data-date="${t.date}" data-idx="${idx}" onchange="updateBar()"></td>` : ''}
                <td style="font-family:Padauk;">${escapeHtml(r.task)}</td>
                <td style="color:var(--success);">${hideValue(r.get)}</td>
                <td style="color:var(--cyan);">${Number(r.pay || 0).toLocaleString()}</td>
                <td><span class="edit-link" onclick="editEntry('${escapeHtml(name)}','${t.date}',${idx})">EDIT</span></td>
            </tr>`).join('');

        let dayGet = 0, dayPay = 0;
        (t.rows || []).forEach(r => { dayGet += Number(r.get || 0); dayPay += Number(r.pay || 0); });

        return `<div class="day-block">
            <div class="day-block-header">
                <span>${t.date}</span>
                <span>${hideValue(dayGet)} / ${dayPay.toLocaleString()}</span>
            </div>
            <table>
                <tr><th>${isAdmin ? '<th></th>' : ''}</th><th>TASK</th><th>GET</th><th>PAY</th><th></th></tr>
                ${rows}
            </table>
        </div>`;
    }).join('') || '<div class="empty-state">No logs for this month.</div>';

    openModal(`${name}  ${month}`, `
        <button class="btn btn-primary" style="width:auto;padding:6px 16px;margin-bottom:14px;" onclick="showMonthlySummary()"> BACK</button>
        <div class="stat-box">
            <div class="stat-item" style="border-color:var(--success);">
                <div class="stat-label">TOTAL GET</div>
                <div class="stat-value" style="color:var(--success);">${hideValue(totalGet)}</div>
            </div>
            <div class="stat-item" style="border-color:var(--cyan);">
                <div class="stat-label">TOTAL PAY</div>
                <div class="stat-value" style="color:var(--cyan);">${totalPay.toLocaleString()}</div>
            </div>
        </div>
        ${batchBar}
        ${dayBlocks}
    `);
}

function toggleAll(master) {
    document.querySelectorAll('.row-check').forEach(c => c.checked = master.checked);
    updateBar();
}

function updateBar() {
    const checked = document.querySelectorAll('.row-check:checked');
    const bar = document.getElementById('batchBar');
    if (bar) {
        bar.style.display = checked.length > 0 ? 'flex' : 'none';
        document.getElementById('selCount').textContent = checked.length + ' selected';
    }
}

function deleteSelected(name, month) {
    const checked = document.querySelectorAll('.row-check:checked');
    if (!checked.length) return;
    if (!confirm(`Delete ${checked.length} record(s)?`)) return;

    let targets = {};
    checked.forEach(c => {
        const d = c.dataset.date, i = parseInt(c.dataset.idx);
        if (!targets[d]) targets[d] = [];
        targets[d].push(i);
    });
    Object.keys(targets).forEach(d => {
        const tech = data.technicians.find(t => t.name === name && t.date === d);
        if (tech?.rows) targets[d].sort((a, b) => b - a).forEach(i => tech.rows.splice(i, 1));
    });
    save().then(() => viewTechMonthDetail(name, month));
}

// 
//  SETTINGS
// 
function openSettings() {
    if (!isAdmin) return;

    const scHtml = (data.shortcuts || []).map((s, i) => `
        <div class="list-row">
            <span style="font-family:Padauk;">${escapeHtml(s.task)} <span style="color:var(--muted);font-size:10px;">/ ${Number(s.pay).toLocaleString()} KS</span></span>
            <span onclick="deleteShortcut(${i})" style="color:var(--danger); cursor:pointer; font-family:var(--mono); font-size:11px;"></span>
        </div>`).join('');

    const techHtml = (data.masterNames || []).map((n, i) => `
        <div class="list-row">
            <span>${escapeHtml(n)}</span>
            <span onclick="deleteMaster(${i})" style="color:var(--danger); cursor:pointer; font-family:var(--mono); font-size:11px;"></span>
        </div>`).join('');

    openModal('SETTINGS', `
        <div class="section-title">SHORTCUTS</div>
        <div style="display:flex; gap:6px; margin-bottom:10px;">
            <input id="stTask" class="input" style="margin:0;" placeholder="Task name">
            <input id="stPay" type="number" class="input" style="margin:0; width:100px;" placeholder="Pay">
            <button class="btn btn-primary" style="width:auto; margin:0; padding:0 14px;" onclick="addShortcut()">+</button>
        </div>
        ${scHtml || '<div style="color:var(--muted);font-size:11px;margin-bottom:10px;">No shortcuts yet.</div>'}

        <div class="section-title" style="margin-top:18px;">TECHNICIANS</div>
        <div style="display:flex; gap:6px; margin-bottom:10px;">
            <input id="newMName" class="input" style="margin:0;" placeholder="Technician name">
            <button class="btn btn-primary" style="width:auto; margin:0; padding:0 14px;" onclick="addMaster()">+</button>
        </div>
        ${techHtml || '<div style="color:var(--muted);font-size:11px;">No technicians yet.</div>'}

        <div class="section-title" style="margin-top:18px;">CHANGE PASSWORD</div>
        <input id="newPass" type="password" class="input" placeholder="New password">
        <button class="btn btn-danger" onclick="updatePass()">UPDATE PASSWORD</button>
    `);
}

function addShortcut() {
    const t = document.getElementById('stTask').value.trim();
    const p = document.getElementById('stPay').value;
    if (!t || !p) { showToast(' FILL ALL FIELDS', 'var(--danger)'); return; }
    if (!data.shortcuts) data.shortcuts = [];
    data.shortcuts.push({ task: t, pay: Number(p) });
    save().then(openSettings);
}

function deleteShortcut(i) {
    data.shortcuts.splice(i, 1);
    save().then(openSettings);
}

function addMaster() {
    const n = document.getElementById('newMName').value.trim();
    if (!n) { showToast(' NAME REQUIRED', 'var(--danger)'); return; }
    if (!data.masterNames) data.masterNames = [];
    if (data.masterNames.includes(n)) { showToast(' ALREADY EXISTS', 'var(--danger)'); return; }
    data.masterNames.push(n);
    save().then(openSettings);
}

function deleteMaster(i) {
    if (!confirm('Remove this technician?')) return;
    data.masterNames.splice(i, 1);
    save().then(openSettings);
}

function updatePass() {
    const p = document.getElementById('newPass').value;
    if (!p || p.length < 4) { showToast(' MIN 4 CHARACTERS', 'var(--danger)'); return; }
    data.adminPass = p;
    save().then(() => { showToast(' PASSWORD UPDATED', 'var(--success)'); openSettings(); });
}

// 
//  LOGIN / LOGOUT
// 
function toggleLogin() {
    if (isAdmin) {
        isAdmin = false;
        document.getElementById('mainBody').classList.remove('is-admin');
        document.getElementById('loginBtn').textContent = 'LOGIN';
        showToast('LOGGED OUT', 'var(--muted)');
        renderGrid();
    } else {
        const p = prompt('ADMIN PASSWORD:');
        if (p === null) return;
        if (p === data.adminPass) {
            isAdmin = true;
            document.getElementById('mainBody').classList.add('is-admin');
            document.getElementById('loginBtn').textContent = 'LOGOUT';
            showToast(' ADMIN ACCESS', 'var(--success)');
            renderGrid();
        } else {
            showToast(' WRONG PASSWORD', 'var(--danger)');
        }
    }
}

// 
//  DATE CHANGE
// 
function changeDate(v) {
    selectedDate = v;
    currentViewingMonth = v.substring(0, 7);
    renderGrid();
}

// Keyboard: Escape closes modal
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
